# Copy to config.yaml. The loader consumes factory/name/group; all other keys
# are passed directly to the selected provider preset. A custom factory may be
# referenced as "my_package.clients:create_client" without editing the engine.
clients:
  - factory: codex
    name: Codex CLI Stateless
    group: codex_cli
    mode: stateless
    sandbox: read-only

# Group concurrency belongs to the manager, not to an individual client.
group_limits:
  codex_cli: 1
